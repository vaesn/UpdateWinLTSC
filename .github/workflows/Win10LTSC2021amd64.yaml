name: Windows10_LTSC2021_amd64
on: workflow_dispatch
permissions:
  contents: write
env:
  REVISION: '19044.7725'
  REVISION_NAME: Windows10_LTSC2021_amd64
jobs:
  Windows10_LTSC2021_amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        
      - name: Step-1 Initialize Workspace
        shell: pwsh
        working-directory: .
        run: |
          mkdir -Force src
          mkdir -Force dist

      - name: Step-2 Checkout Win_ISO_Patching_Scripts
        shell: pwsh
        working-directory: .
        run: |
          git clone https://github.com/adavak/Win_ISO_Patching_Scripts.git
          
      - name: Step-3 Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: ./src
        run: |
          #gh release download v1.0.0 --repo ${{ github.repository }} --pattern "*.7z.*" --dir ./
          curl -L -o Windows10LTSC2021amd64Original.iso https://ts.buzzheavier.com/d/h1yn52aj10ft?v=rjtYKf8A_SHutaTdAssjAQ--wNwzW1m5j5b7vIa881ObfD4hbmXJ_aSBkxEDyOB3ZIDjM8VBSTFbvLud9fi0_QS94eqrUYEVX__7N67Ul03ZxTQrTs_QM0Cg9AItDx7SUkgU1380KQvP0pENJVtESDQ2-aviJdt7-Fl9M6pPstJzh2SiJizXCFvbRdIEZtVJpgjS8xalOaxkYysoVg33MbrZo0KGdXo8XYzRn1rC6MxIvTOUBN3yZI1LI13oq3udsmHCiAP2N2Yy

          #7z x Win10LTSC2021amd64.7z.001 -y
          Rename-Item -Path "*.iso" -NewName "Windows10LTSC2021amd64Original.iso"
          #Remove-Item -Path "*.7z.*" -Force
          
      - name: Step-4 Update By Win_ISO_Patching_Scripts
        shell: cmd
        working-directory: .
        run: |
          copy ".\set\W10UI.ini" ".\Win_ISO_Patching_Scripts\" /Y
          copy ".\set\W10UI.cmd" ".\Win_ISO_Patching_Scripts\" /Y
          move ".\src\Windows10LTSC2021amd64Original.iso" ".\Win_ISO_Patching_Scripts\" /Y
          .\Win_ISO_Patching_Scripts\Start.cmd
        
      - name: Step-5 Split Archive
        shell: pwsh
        working-directory: .
        run: |
          $file = Get-ChildItem -Path .\Win_ISO_Patching_Scripts -Filter "*.iso" -File | Select-Object -First 1
          $fileNameOnly =$file.Name
          $fullPath =$file.FullName
          Add-Content -Path $env:GITHUB_ENV -Value "FINAL_ARTIFACT_NAME=$fileNameOnly"
          Add-Content -Path $env:GITHUB_ENV -Value "FINAL_ARTIFACT_PATH=$fullPath"
          Write-Host "捕获到的文件名: $fileNameOnly"
          Write-Host "完整路径: $fullPath"
          7z a -t7z -v1650M -mx=0 .\${{ env.REVISION_NAME }}_${{ env.REVISION }}.7z .\Win_ISO_Patching_Scripts\*.iso
          Write-Host "Split Archive Done..."
          Remove-Item -Path "*.iso" -Force
      
      - name: Step-6 Delete Old Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release delete ${{env.REVISION_NAME}} --cleanup-tag -y || true
        
      - name: Step-7 Build New Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## ${{ env.REVISION_NAME }}_Update_${{ env.REVISION }}
            - **Update**:  ${{ env.FINAL_ARTIFACT_NAME }}
            
            - **Original Image**: zh-cn_windows_10_enterprise_ltsc_2021_x64_dvd_033b7312.iso
            ---
            ### 📦 下载说明
            使用 7-Zip 进行分卷压缩（每卷 1650M）。
            **下载方式**:
            1. 下载所有 `.7z.001`, `.7z.002`, ... 等后缀的文件。
            2. 确保所有文件位于同一文件夹。
            3. 使用 7-Zip 解压 `.7z.001` 即可获得完整的 ISO 文件。
            ---
          tag_name: ${{ env.REVISION_NAME }}
          name: ${{ env.REVISION_NAME }}_${{ env.REVISION }}
          files: |
            ${{ env.ISO_LABEL }}.7z.*
