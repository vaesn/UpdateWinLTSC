name: win10_ltsc_2021_amd64
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 11 * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  win10_ltsc_2021_amd64:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Step-1 Checkout Win_ISO_Patching_Scripts
        shell: pwsh
        working-directory: .
        run: |
          $maxAttempts = 5
          $delaySeconds = 30
          $repoUrl = 'https://github.com/adavak/Win_ISO_Patching_Scripts.git'

          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Cloning patch scripts (attempt $i/$maxAttempts)..."

            if (Test-Path patcherScripts) { Remove-Item patcherScripts -Recurse -Force }

            & git clone --depth 1 $repoUrl patcherScripts
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Clone succeeded"
              break
            }

            Write-Host "git clone failed with exit code $LASTEXITCODE"
            if ($i -lt $maxAttempts) {
              Write-Host "Retrying in $delaySeconds seconds..."
              Start-Sleep -Seconds $delaySeconds
            } else {
              throw "git clone failed after $maxAttempts attempts"
            }
          }

      - name: Step-2 Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: ./patcherScripts
        run: |
          gh release download Windows_10_LTSC_2021_X64_ZH-CN --repo adavak/win_iso_zip --pattern "*033b7312.zip.*" --dir ./
          7z x *.zip.001 -y
          Start-Sleep -Seconds 3
          Rename-Item -Path "*.iso" -NewName "win10ltsc2021amd64.iso"
          Remove-Item -Path "*.zip.*" -Force
          New-Item -ItemType Directory -Force -Path "assets"
          Move-Item -Path "../W10UI.ini" -Destination "./W10UI.ini" -Force
          Get-ChildItem -Recurse

      - name: Step-3 Update By Win_ISO_Patching_Scripts
        shell: pwsh
        working-directory: ./patcherScripts
        run: |
          & cmd /c "(echo 9 & echo 9 & echo 9) | Start.cmd"
          if ($LASTEXITCODE -ne 0) { throw "Start.cmd failed with exit code $LASTEXITCODE" }

      - name: Step-4 Split Archive
        shell: pwsh
        working-directory: .
        run: |
          Remove-Item -Path "./patcherScripts/win10ltsc2021amd64.iso" -Force -ErrorAction SilentlyContinue
          $SourceDir = "./patcherScripts/assets"
          $DistDir = "dist_win10ltsc2021amd64"
          $RevisionName = "win10_ltsc_2021_amd64"
          New-Item -Path $DistDir -ItemType Directory -Force | Out-Null
          $IsoFile = Get-ChildItem -Path $SourceDir -Filter "*.iso" -File | Select-Object -First 1
          $FullHash = (Get-FileHash -Path $IsoFile.FullName -Algorithm SHA256).Hash.ToLower()
          $ShortHash = $FullHash.Substring($FullHash.Length - 8)
          $NewFileName = "$($IsoFile.BaseName)_$ShortHash.iso"
          $NewFilePath = Join-Path -Path $IsoFile.DirectoryName -ChildPath $NewFileName
          Rename-Item -Path $IsoFile.FullName -NewName $NewFileName -Force
          $Revision = $IsoFile.BaseName.Split('-')[0]
          $SizeInBytes = $IsoFile.Length
          $SizeInMB = $SizeInBytes / 1MB
          $SizeInGB = $SizeInBytes / 1GB
          $VolumeSizeVal = [int][Math]::Ceiling($SizeInMB / 5) + 32
          $VolumeSizeArg = "${VolumeSizeVal}M"
          $EnvVars = @(
              "ISO_SIZEMB={0:N2} MB" -f $SizeInMB
              "ISO_SIZEGB={0:N2} GB" -f $SizeInGB
              "VOLUME_SIZE=$VolumeSizeArg"
              "ISO_NAME=$NewFileName"
              "ISO_PATH=$NewFilePath"
              "ISO_REVISION=$Revision"
              "REVISION_NAME=$RevisionName"
              "SHA256=$FullHash"
          )
          $EnvVars | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  ISO Processing Information" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          @(
              "文件名: $NewFileName"
              "大小 : {0:N2} MB" -f $SizeInMB
              "大小 : {0:N2} GB" -f $SizeInGB
              "路径 : $NewFilePath"
              "版本 : $Revision"
              "SHA256: $FullHash"
              "VolumeSize: $VolumeSizeArg"
          ) | ForEach-Object { Write-Host "  $_" }
          Write-Host "========================================" -ForegroundColor Cyan
          $OutputZipFileName = "${RevisionName}-${Revision}.7z"
          $OutputZipPath = Join-Path -Path $DistDir -ChildPath $OutputZipFileName
          $Args7z = @(
              "a",
              "-t7z",
              "-v${VolumeSizeArg}",
              "-mx=0",
              ('"{0}"' -f $OutputZipPath),
              ('"{0}"' -f $NewFilePath)
          )
          # & 7z a -t7z -v$VolumeSizeArg -mx=0 "$OutputZipPath" "$NewFilePath"
          Write-Host "Executing command: $Args7z"
          $process = Start-Process -FilePath "7z" -ArgumentList $Args7z -Wait -NoNewWindow -PassThru
          if ($process.ExitCode -ne 0) {
              Write-Error "7z failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }
          Write-Host "Generated archive: $OutputZipPath"
          Get-ChildItem -Recurse
          Write-Host "Split Archive Done..." -ForegroundColor Green

      - name: Step-5 Delete Old Release
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release delete ${{ env.REVISION_NAME }} --cleanup-tag -y || true

      - name: Step-6 Delete past completed runs of this workflow
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --workflow "${{ github.workflow }}" \
            --json databaseId,status,conclusion \
            --limit 50 \
            --jq '.[] | select(.status == "completed") | .databaseId' \
            | while read -r run_id; do
                [ "$run_id" = "${{ github.run_id }}" ] && continue
                gh run delete "$run_id" || true
              done

      - name: Step-7 Build New Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## windows10_ltsc_2021_amd64_update-${{ env.ISO_REVISION }}
            - **ARTIFACT**: ${{ env.ISO_NAME }}
            - **SHA256**: ${{ env.SHA256 }}
            - **File Size**: ${{ env.ISO_SIZEMB }} ， ${{ env.ISO_SIZEGB }}
            - **Volume Size**: ${{ env.VOLUME_SIZE }}
            - **ORIGINAL**: zh-cn_windows_10_enterprise_ltsc_2021_x64_dvd_033b7312.iso
            ---
            ### 📦 下载说明
            使用 7-Zip 进行分卷压缩（每卷 ${{ env.VOLUME_SIZE }}）。
            **下载方式**:
            1. 下载所有 `.7z.001`, `.7z.002`, ... 等后缀的文件。
            2. 确保所有文件位于同一文件夹。
            3. 使用 7-Zip 解压 `.7z.001` 即可获得完整的 ISO 文件。
            4. 使用 `https://gh-proxy.com/` 加速下载
            ---
            > ⚠️ **Note**: This is a multi-volume archive (.7z.001, .7z.002...). Please download all parts before extracting.
          tag_name: ${{ env.REVISION_NAME }}
          name: ${{ env.REVISION_NAME }}-${{ env.ISO_REVISION }}
          files: |
            ./dist_win10ltsc2021amd64/${{ env.REVISION_NAME }}-${{ env.ISO_REVISION }}.7z.*

      - name: Step-8 Update README
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $newTimeNOW = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
          $fileName = $env:ISO_NAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ($i = 0; $i -lt 5; $i++) {
              git fetch origin main
              git reset --hard origin/main
              $readmeOriginal = Get-Content README.md -Raw -Encoding utf8
              $replacement = "<!-- WIN10_LTSC_2021_amd64 -->`n$fileName ($newTimeNOW UTC)`n<!-- /WIN10_LTSC_2021_amd64 -->"
              $readmeUpdated = [regex]::Replace(
                  $readmeOriginal,
                  '(?s)(<!-- WIN10_LTSC_2021_amd64 -->).*?(<!-- /WIN10_LTSC_2021_amd64 -->)',
                  { $replacement }
              )
              [IO.File]::WriteAllText("$pwd/README.md", $readmeUpdated, [Text.UTF8Encoding]::new($false))
              git add README.md
              git commit -m "update" --allow-empty
              git push && break
              Start-Sleep 3
          }
